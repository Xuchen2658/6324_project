<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recently Deleted</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recent_deleted.css') }}">

    <script>
        window.PAGE_DATA = {
            username: {{ username|tojson }},
            language: {{ language|tojson }}
        };
    </script>
</head>
<body>
<div id="app">
    <div class="header">
        <div><strong>[[ t.recentDeleted ]]</strong>（[[ username ]]）</div>
        <div>
            <button @click="goWardrobe">[[ t.viewWardrobe ]]</button>
        </div>
    </div>

    <div class="container">
        <div v-if="items.length === 0" class="empty-box">
            [[ t.recentDeletedEmpty ]]
        </div>

        <div class="grid" v-else>
            <div class="card" v-for="item in items" :key="item.id">
                <img :src="item.image_url" :alt="item.filename" />

                <div class="title">[[ item.category_name || 'Unknown' ]]</div>

                <div class="meta">
                    <div>[[ t.mainCategory ]]: [[ item.main_category || 'Others' ]]</div>
                    <div>[[ t.filename ]]: [[ item.filename ]]</div>
                    <div>[[ t.addedTime ]]: [[ item.deleted_at || 'N/A' ]]</div>
                </div>

                <div style="margin-top: 8px;">
                    <span class="tag" v-for="attr in item.attribute_names" :key="attr">[[ attr ]]</span>
                </div>

                <button class="success full-width" @click="restoreItem(item.id)">[[ t.restore ]]</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/recent_deleted.js') }}"></script>
</body>
</html>
